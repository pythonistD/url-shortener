services:
  traefik:
    image: traefik:v3.2
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network

  url-shortener:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: url-shortener
    env_file:
      - .env
    environment:
      - ENV=local
      - SERVER_PORT=8080
      - STORAGE_TYPE=in-memory
    expose:
      - "8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.url-shortener.rule=PathPrefix(`/`)"
      - "traefik.http.routers.url-shortener.entrypoints=web"
      - "traefik.http.routers.url-shortener.middlewares=api-ratelimit"
      - "traefik.http.middlewares.api-ratelimit.ratelimit.average=5"
      - "traefik.http.middlewares.api-ratelimit.ratelimit.burst=10"
      - "traefik.http.services.url-shortener.loadbalancer.server.port=8080"
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
