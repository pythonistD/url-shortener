version: "2"
run:
  tests: true
linters:
  enable:
    - gocritic
    - gosec
    - revive
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - linters:
          - gocritic
        text: "hugeParam"
      - linters:
          - gosec
        text: "G710"
      - linters:
          - gosec
        text: "G304"
      - linters:
          - gosec
        text: "G703"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
